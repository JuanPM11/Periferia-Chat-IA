# Despliegue en Render (https://render.com) — un servicio web Docker.
# Tras conectar el repo, define ANTHROPIC_API_KEY en el dashboard (Secret).
services:
  - type: web
    name: reto-03-ordenes-compra
    runtime: docker
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false # se define como secreto en el dashboard, nunca en el repo
      - key: AGENT_MAX_ITERS
        value: "25"
      - key: AGENT_MAX_TOKENS_SESSION
        value: "200000"
    healthCheckPath: /api/health
